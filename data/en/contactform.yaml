action: https://formspree.io/f/YOUR_FORM_ID
placeholders: false
fields:
  - name: name
    input_type: text
    label: Name
    required: true
  - name: firm_name
    input_type: text
    label: Firm name
    required: true
  - name: email
    input_type: email
    label: Email address
    required: true
  - name: country
    input_type: select
    label: Country
    options:
      - India
      - US
      - Other
    required: true
  - name: num_clients
    input_type: text
    label: Number of clients
    required: false
  - name: primary_interest
    input_type: select
    label: Primary interest
    options:
      - India compliance
      - US compliance
      - Both
      - Just exploring
    required: true
  - name: message
    input_type: textarea
    label: Message (optional)
    required: false
  - name: submit
    input_type: submit
    label: Request a Demo
    required: true
