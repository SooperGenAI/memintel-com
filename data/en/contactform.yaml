action: https://formspree.io/f/YOUR_FORM_ID
placeholders: false
fields:
  - name: title
    input_type: html
    label: <h3>Tell us about your business</h3>
    required: false
  - name: name
    input_type: text
    label: Name
    required: true
  - name: company
    input_type: text
    label: Company
    required: true
  - name: email
    input_type: email
    label: Email address
    required: true
  - name: phone
    input_type: tel
    label: Phone
    required: false
  - name: company_type
    input_type: select
    label: Business type
    options:
      - Manufacturing
      - Services
      - Retail / E-commerce
      - Distribution / Trading
      - SaaS / Technology
      - Other
    required: true
  - name: num_clients
    input_type: text
    label: Your ERP (Tally, Zoho, SAP, etc.)
    required: false
  - name: submit
    input_type: submit
    label: Talk to Us
    required: true
